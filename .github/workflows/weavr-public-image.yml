name: weavr public image

# ghcr.io/desync-labs/claw-agent: this fork built with the upstream Dockerfile,
# then weavr/Dockerfile on top (wallet tool deps, PayBox CLI, skill, brief,
# stamp, signer entrypoint). One image for both containers of
# weavr/docker-compose.yml. Tags: <sha>-dev and dev off a branch; vX.Y.Z and
# latest off a tag. The package is public (set once in the org's package
# settings); pulling needs no login.

on:
  push:
    branches: ['weavr', 'feat/weavr-public']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: weavr-public-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/claw-agent

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: weavr layer tests
        run: cd weavr && npm ci && node --test tests/*.test.mjs

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        name: tag scheme
        run: |
          short=$(git rev-parse --short=7 HEAD)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tags="${GITHUB_REF#refs/tags/} $short latest"
          else
            tags="$short-dev dev"
          fi
          { echo "list<<EOT"; for t in $tags; do echo "$IMAGE:$t"; done; echo "EOT"; } >> "$GITHUB_OUTPUT"
          echo "pin=${tags%% *}" >> "$GITHUB_OUTPUT"

      - name: fork image (upstream Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: hermes-base:ci
          build-args: HERMES_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: weavr image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: weavr/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: BASE_IMAGE=hermes-base:ci

      - name: smoke
        run: |
          docker run --rm --entrypoint /opt/hermes/.venv/bin/hermes "$IMAGE:${{ steps.tags.outputs.pin }}" --version
          docker run --rm --entrypoint weavr-signer "$IMAGE:${{ steps.tags.outputs.pin }}" paybox --version
