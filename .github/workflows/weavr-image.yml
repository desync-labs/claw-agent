name: weavr agent image

# The agent image for the weavr deployments: the fork at this commit, built
# with the upstream Dockerfile (s6, HERMES_HOME=/opt/data, uid 10000) and
# pushed to GHCR. The in-cluster chart (weavr-infrastructure
# helm/charts/weavr-curator-agent) and the compose file (composable-portfolios-ops
# compose/curator-agent.yml) pin the sha tag; `weavr` floats with the branch.

on:
  push:
    branches: ['weavr', 'feat/weavr-*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: weavr-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: HERMES_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke
        run: |
          docker run --rm --entrypoint /opt/hermes/.venv/bin/hermes "$IMAGE:sha-$(git rev-parse --short=7 HEAD)" --version
